name: Verify full-stack blog

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_PATH: /tmp/hai-blog-ci.sqlite
      - run: npm run type-check
      - run: npm run build
