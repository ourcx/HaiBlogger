name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Clean install dependencies
        run: |
          # 清除现有的 node_modules 和 package-lock
          rm -rf node_modules package-lock.json
          
          # 创建新的 package.json 只包含必需的依赖
          cat > package-new.json << 'EOF'
          {
            "name": "xh-blog",
            "private": true,
            "version": "0.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "markdown-it": "^14.1.0",
              "naive-ui": "^2.42.0",
              "pinia": "^3.0.3",
              "vue": "^3.5.17",
              "vue-router": "^4.5.1"
            },
            "devDependencies": {
              "@vitejs/plugin-vue": "^4.6.2",
              "vite": "^5.2.11",
              "typescript": "~5.8.3",
              "@types/markdown-it": "^14.1.0"
            }
          }
          EOF
          
          # 使用新的 package.json 安装依赖
          mv package-new.json package.json
          npm install
          
      - name: Build
        run: npm run build
        
      - name: Deploy to dev
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev
          folder: dist