name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js with compatibility fixes
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # 使用 Node.js 18 更稳定
          
      - name: Fix crypto issue
        run: |
          # 添加这个 polyfill 来修复 crypto.hash 问题
          echo "import { webcrypto } from 'crypto'; globalThis.crypto = webcrypto;" > crypto-polyfill.js
          
      - name: Install dependencies with fixed versions
        run: |
          # 临时安装兼容版本
          npm install vite@^5.0.0 @vitejs/plugin-vue@^4.5.0
          # 安装其他依赖
          npm ci
          
      - name: Build with polyfill
        run: |
          # 使用 Node 选项加载 polyfill
          NODE_OPTIONS="--require ./crypto-polyfill.js" npm run build
          
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dev
          folder: dist