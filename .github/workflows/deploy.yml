name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

# 添加必要的权限配置
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Clean npm cache
        run: |
          npm cache clean --force

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Create or preserve CNAME file
        run: |
          # 检查是否存在 CNAME 文件
          if [ -f CNAME ]; then
            echo "CNAME file exists, copying to dist directory"
            cp CNAME ./dist/CNAME
          else
            echo "No CNAME file found, creating CNAME.md placeholder"
            echo "norubias.site" > ./dist/CNAME
          fi

      - name: Deploy to dev branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: dev
          force_orphan: false  # 设置为 false 以保留历史，这样不会删除 CNAME 文件
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'